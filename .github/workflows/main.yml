name: External Libraries
on:
#  push:
#    branches:
#      - main
#      - build
#    paths-ignore:
#      - 'README*'
#  schedule:
#    - cron: '12 4 * * 4'
  workflow_dispatch:
jobs:
  Build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        triplet:
          - x64-windows-static
          - x64-mingw-static
          - x86-windows-static
          - x86-mingw-static
    steps:
      - name: 'Disable git autocrlf'
        shell: bash
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
      - name: 'Build libraries'
        shell: cmd
        run: scripts/build-windows.bat ${{ matrix.triplet }}
      - name: 'Upload staged files'
        uses: actions/upload-artifact@v7
        with:
          name: stage-${{ matrix.triplet }}
          path: stage/${{ matrix.triplet }}
  Package:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - uses: actions/checkout@v6
      - name: 'Download x64-windows-static stage'
        uses: actions/download-artifact@v8
        with:
          name: stage-x64-windows-static
          path: stage/x64-windows-static
      - name: 'Download x64-mingw-static stage'
        uses: actions/download-artifact@v8
        with:
          name: stage-x64-mingw-static
          path: stage/x64-mingw-static
      - name: 'Download x86-windows-static stage'
        uses: actions/download-artifact@v8
        with:
          name: stage-x86-windows-static
          path: stage/x86-windows-static
      - name: 'Download x86-mingw-static stage'
        uses: actions/download-artifact@v8
        with:
          name: stage-x86-mingw-static
          path: stage/x86-mingw-static
      - name: 'Package'
        run: scripts/package
      - name: 'Upload results'
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: distribution
